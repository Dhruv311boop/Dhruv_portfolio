<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    .priority-high { border-left: 3px solid #ef4444; }
    .priority-medium { border-left: 3px solid #f59e0b; }
    .priority-low { border-left: 3px solid #22c55e; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold tracking-tight mb-2">TaskFlow</h1>
        <p class="text-gray-400">Your all-in-one SaaS productivity platform</p>
      </div>

      <div class="bg-gray-900 rounded-2xl border border-gray-800 overflow-hidden">
        <div class="flex border-b border-gray-800">
          <button id="loginTab" onclick="switchTab('login')"
            class="flex-1 py-4 text-sm font-semibold text-white bg-gray-800">Login</button>
          <button id="registerTab" onclick="switchTab('register')"
            class="flex-1 py-4 text-sm font-semibold text-gray-500 hover:text-white transition">Register</button>
        </div>

        <div class="p-8">
          <div id="loginForm">
            <div class="space-y-4">
              <input id="loginEmail" type="email" placeholder="Email"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
              <input id="loginPassword" type="password" placeholder="Password"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
              <button onclick="login()"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition">Sign In</button>
            </div>
          </div>

          <div id="registerForm" class="hidden">
            <div class="space-y-4">
              <input id="regName" type="text" placeholder="Full name"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
              <input id="regEmail" type="email" placeholder="Email"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
              <input id="regPassword" type="password" placeholder="Password (min 6 chars)"
                class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition" />
              <button onclick="register()"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl transition">Create Account</button>
            </div>
          </div>

          <p id="authError" class="text-red-400 text-sm text-center mt-4 hidden"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen">
    <!-- Navbar -->
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xl font-extrabold">TaskFlow</span>
        <span id="planBadge" class="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-medium border border-blue-500/30">Free</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="navUser" class="text-sm text-gray-400"></span>
        <button onclick="logout()" class="text-sm text-gray-400 hover:text-white transition px-3 py-1.5 rounded-lg hover:bg-gray-800">Logout</button>
      </div>
    </nav>

    <div class="max-w-5xl mx-auto px-6 py-10">
      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10 fade-in">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
          <p class="text-gray-500 text-sm mb-1">Total Tasks</p>
          <p id="statTotal" class="text-3xl font-extrabold">0</p>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
          <p class="text-gray-500 text-sm mb-1">Completed</p>
          <p id="statCompleted" class="text-3xl font-extrabold text-green-400">0</p>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
          <p class="text-gray-500 text-sm mb-1">Pending</p>
          <p id="statPending" class="text-3xl font-extrabold text-yellow-400">0</p>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
          <p class="text-gray-500 text-sm mb-1">High Priority</p>
          <p id="statHigh" class="text-3xl font-extrabold text-red-400">0</p>
        </div>
      </div>

      <!-- Add Task -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-6">
        <h2 class="font-bold text-lg mb-4">Add Task</h2>
        <div class="flex gap-3 flex-wrap">
          <input id="taskInput" type="text" placeholder="Task title..." maxlength="100"
            class="flex-1 min-w-48 px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
            onkeydown="if(event.key==='Enter') addTask()" />
          <select id="prioritySelect"
            class="px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-blue-500 transition">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button onclick="addTask()"
            class="px-6 py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-xl transition">Add</button>
        </div>
        <p id="taskError" class="text-red-400 text-sm mt-2 hidden"></p>
      </div>

      <!-- Task List -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
        <div class="flex items-center justify-between mb-5">
          <h2 class="font-bold text-lg">Tasks</h2>
          <div class="flex gap-2">
            <button onclick="filterTasks('all')" id="filterAll" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium">All</button>
            <button onclick="filterTasks('pending')" id="filterPending" class="text-xs px-3 py-1.5 rounded-lg bg-gray-800 text-gray-400 hover:text-white transition font-medium">Pending</button>
            <button onclick="filterTasks('done')" id="filterDone" class="text-xs px-3 py-1.5 rounded-lg bg-gray-800 text-gray-400 hover:text-white transition font-medium">Done</button>
          </div>
        </div>
        <div id="taskList" class="space-y-3"></div>
        <div id="emptyTasks" class="text-center py-10 text-gray-600">
          <p class="text-4xl mb-3">📋</p>
          <p>No tasks yet. Add one above!</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';
    let token = localStorage.getItem('token');
    let tasks = [];
    let currentFilter = 'all';

    async function api(method, path, body) {
      const res = await fetch(API + path, {
        method,
        headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function switchTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('loginTab').className = `flex-1 py-4 text-sm font-semibold transition ${tab==='login' ? 'text-white bg-gray-800' : 'text-gray-500 hover:text-white'}`;
      document.getElementById('registerTab').className = `flex-1 py-4 text-sm font-semibold transition ${tab==='register' ? 'text-white bg-gray-800' : 'text-gray-500 hover:text-white'}`;
    }

    function showAuthError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg; el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    async function login() {
      try {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const data = await api('POST', '/auth/login', { email, password });
        token = data.token;
        localStorage.setItem('token', token);
        showDashboard(data.user);
      } catch (e) { showAuthError(e.message); }
    }

    async function register() {
      try {
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const data = await api('POST', '/auth/register', { name, email, password });
        token = data.token;
        localStorage.setItem('token', token);
        showDashboard(data.user);
      } catch (e) { showAuthError(e.message); }
    }

    async function showDashboard(user) {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('navUser').textContent = user.name;
      document.getElementById('planBadge').textContent = user.plan.charAt(0).toUpperCase() + user.plan.slice(1);
      await loadStats();
      await loadTasks();
    }

    async function loadStats() {
      try {
        const s = await api('GET', '/dashboard/stats');
        document.getElementById('statTotal').textContent = s.total;
        document.getElementById('statCompleted').textContent = s.completed;
        document.getElementById('statPending').textContent = s.pending;
        document.getElementById('statHigh').textContent = s.highPriority;
      } catch {}
    }

    async function loadTasks() {
      try {
        tasks = await api('GET', '/tasks');
        renderTasks();
      } catch {}
    }

    async function addTask() {
      const title = document.getElementById('taskInput').value.trim();
      const priority = document.getElementById('prioritySelect').value;
      if (!title) { showTaskError('Please enter a task title'); return; }
      try {
        const task = await api('POST', '/tasks', { title, priority });
        tasks.unshift(task);
        document.getElementById('taskInput').value = '';
        renderTasks();
        loadStats();
      } catch (e) { showTaskError(e.message); }
    }

    async function toggleTask(id, completed) {
      try {
        const updated = await api('PATCH', `/tasks/${id}`, { completed: !completed });
        tasks = tasks.map(t => t._id === id ? updated : t);
        renderTasks();
        loadStats();
      } catch {}
    }

    async function deleteTask(id) {
      try {
        await api('DELETE', `/tasks/${id}`);
        tasks = tasks.filter(t => t._id !== id);
        renderTasks();
        loadStats();
      } catch {}
    }

    function filterTasks(f) {
      currentFilter = f;
      ['all','pending','done'].forEach(x => {
        const btn = document.getElementById(`filter${x.charAt(0).toUpperCase()+x.slice(1)}`);
        btn.className = `text-xs px-3 py-1.5 rounded-lg font-medium transition ${x===f ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-white'}`;
      });
      renderTasks();
    }

    function renderTasks() {
      const filtered = tasks.filter(t => {
        if (currentFilter === 'pending') return !t.completed;
        if (currentFilter === 'done') return t.completed;
        return true;
      });
      const list = document.getElementById('taskList');
      const empty = document.getElementById('emptyTasks');
      if (!filtered.length) { list.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      list.innerHTML = filtered.map(t => `
        <div class="flex items-center gap-4 bg-gray-800 rounded-xl px-5 py-4 priority-${t.priority} fade-in group">
          <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t._id}', ${t.completed})"
            class="w-5 h-5 rounded accent-blue-500 cursor-pointer shrink-0" />
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium ${t.completed ? 'line-through text-gray-500' : 'text-white'} truncate">${t.title}</p>
            <p class="text-xs text-gray-600 mt-0.5">${new Date(t.createdAt).toLocaleDateString()}</p>
          </div>
          <span class="text-xs px-2 py-0.5 rounded-full font-medium shrink-0 ${
            t.priority==='high' ? 'bg-red-500/20 text-red-400' :
            t.priority==='medium' ? 'bg-yellow-500/20 text-yellow-400' :
            'bg-green-500/20 text-green-400'
          }">${t.priority}</span>
          <button onclick="deleteTask('${t._id}')" class="text-gray-600 hover:text-red-400 transition opacity-0 group-hover:opacity-100 text-lg shrink-0">×</button>
        </div>
      `).join('');
    }

    function showTaskError(msg) {
      const el = document.getElementById('taskError');
      el.textContent = msg; el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function logout() {
      localStorage.removeItem('token');
      token = null;
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
    }

    async function init() {
      if (token) {
        try {
          const user = await api('GET', '/auth/me');
          showDashboard(user);
        } catch { localStorage.removeItem('token'); token = null; }
      }
    }

    init();
  </script>
</body>
</html>
