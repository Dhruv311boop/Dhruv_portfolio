<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); }
    .glass-dark { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.5s ease forwards; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 text-white">

  <div class="max-w-lg mx-auto px-4 py-10">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-extrabold tracking-tight mb-1">WeatherNow</h1>
      <p class="text-blue-300 text-sm">Real-time weather at your fingertips</p>
    </div>

    <!-- Search -->
    <div class="flex gap-2 mb-8">
      <input
        id="cityInput"
        type="text"
        placeholder="Search city..."
        class="flex-1 px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:border-blue-400 transition"
        onkeydown="if(event.key==='Enter') fetchWeather()"
      />
      <button
        onclick="fetchWeather()"
        class="px-5 py-3 bg-blue-500 hover:bg-blue-400 text-white font-semibold rounded-xl transition"
      >Search</button>
      <button
        onclick="fetchByLocation()"
        title="Use my location"
        class="px-4 py-3 bg-white/10 hover:bg-white/20 rounded-xl transition text-xl"
      >📍</button>
    </div>

    <!-- Error -->
    <div id="error" class="hidden text-red-300 text-sm text-center mb-4 glass rounded-xl px-4 py-3"></div>

    <!-- Loader -->
    <div id="loader" class="hidden flex justify-center my-12">
      <div class="spinner w-10 h-10 border-4 border-blue-400 border-t-transparent rounded-full"></div>
    </div>

    <!-- Main Card -->
    <div id="weatherCard" class="hidden fade-in">
      <div class="glass rounded-3xl p-8 mb-6 text-center relative overflow-hidden">
        <div id="bgOverlay" class="absolute inset-0 opacity-20 rounded-3xl"></div>
        <div class="relative z-10">
          <p id="cityName" class="text-2xl font-bold"></p>
          <p id="countryDate" class="text-blue-300 text-sm mb-6"></p>
          <div id="weatherIcon" class="text-8xl mb-4 leading-none"></div>
          <div id="tempDisplay" class="text-7xl font-extrabold mb-1 tracking-tighter"></div>
          <p id="weatherDesc" class="text-blue-200 text-lg capitalize mb-6"></p>
          <div class="grid grid-cols-3 gap-4">
            <div class="glass-dark rounded-2xl p-4">
              <p class="text-xs text-blue-300 mb-1">Humidity</p>
              <p id="humidity" class="text-xl font-bold"></p>
            </div>
            <div class="glass-dark rounded-2xl p-4">
              <p class="text-xs text-blue-300 mb-1">Wind</p>
              <p id="wind" class="text-xl font-bold"></p>
            </div>
            <div class="glass-dark rounded-2xl p-4">
              <p class="text-xs text-blue-300 mb-1">Feels Like</p>
              <p id="feelsLike" class="text-xl font-bold"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Extra Info -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="glass rounded-2xl p-5">
          <p class="text-xs text-blue-300 mb-1">Sunrise</p>
          <p id="sunrise" class="text-lg font-semibold"></p>
        </div>
        <div class="glass rounded-2xl p-5">
          <p class="text-xs text-blue-300 mb-1">Sunset</p>
          <p id="sunset" class="text-lg font-semibold"></p>
        </div>
        <div class="glass rounded-2xl p-5">
          <p class="text-xs text-blue-300 mb-1">Visibility</p>
          <p id="visibility" class="text-lg font-semibold"></p>
        </div>
        <div class="glass rounded-2xl p-5">
          <p class="text-xs text-blue-300 mb-1">Pressure</p>
          <p id="pressure" class="text-lg font-semibold"></p>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="text-center py-16 text-white/30">
      <div class="text-6xl mb-4">🌤</div>
      <p class="text-lg">Search a city to see weather</p>
    </div>
  </div>

  <script>
    const API_KEY = 'YOUR_OPENWEATHERMAP_API_KEY'; // Replace with your key from openweathermap.org (free)

    const weatherIcons = {
      'Clear': '☀️', 'Clouds': '☁️', 'Rain': '🌧️', 'Drizzle': '🌦️',
      'Thunderstorm': '⛈️', 'Snow': '❄️', 'Mist': '🌫️', 'Fog': '🌫️',
      'Haze': '🌫️', 'Smoke': '🌫️', 'Dust': '🌪️', 'Tornado': '🌪️'
    };

    const bgColors = {
      'Clear': '#f59e0b', 'Clouds': '#6b7280', 'Rain': '#3b82f6',
      'Drizzle': '#60a5fa', 'Thunderstorm': '#7c3aed', 'Snow': '#e0f2fe',
      'Mist': '#9ca3af', 'Fog': '#9ca3af', 'Haze': '#9ca3af'
    };

    function fmt(ts) {
      return new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function showLoader(v) {
      document.getElementById('loader').classList.toggle('hidden', !v);
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    async function fetchWeather(lat, lon) {
      const city = document.getElementById('cityInput').value.trim();
      if (!lat && !city) return showError('Please enter a city name');

      showLoader(true);
      document.getElementById('weatherCard').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');

      const url = lat
        ? `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
        : `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status === 404 ? 'City not found' : 'Failed to fetch weather');
        const d = await res.json();
        renderWeather(d);
      } catch (e) {
        showError(e.message);
        document.getElementById('emptyState').classList.remove('hidden');
      } finally {
        showLoader(false);
      }
    }

    function renderWeather(d) {
      const main = d.weather[0].main;
      document.getElementById('cityName').textContent = d.name;
      document.getElementById('countryDate').textContent = `${d.sys.country} · ${new Date().toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' })}`;
      document.getElementById('weatherIcon').textContent = weatherIcons[main] || '🌡️';
      document.getElementById('tempDisplay').textContent = `${Math.round(d.main.temp)}°C`;
      document.getElementById('weatherDesc').textContent = d.weather[0].description;
      document.getElementById('humidity').textContent = `${d.main.humidity}%`;
      document.getElementById('wind').textContent = `${Math.round(d.wind.speed * 3.6)} km/h`;
      document.getElementById('feelsLike').textContent = `${Math.round(d.main.feels_like)}°C`;
      document.getElementById('sunrise').textContent = fmt(d.sys.sunrise);
      document.getElementById('sunset').textContent = fmt(d.sys.sunset);
      document.getElementById('visibility').textContent = `${(d.visibility / 1000).toFixed(1)} km`;
      document.getElementById('pressure').textContent = `${d.main.pressure} hPa`;
      document.getElementById('bgOverlay').style.background = bgColors[main] || '#3b82f6';
      document.getElementById('weatherCard').classList.remove('hidden');
      document.getElementById('weatherCard').classList.add('fade-in');
    }

    function fetchByLocation() {
      if (!navigator.geolocation) return showError('Geolocation not supported');
      navigator.geolocation.getCurrentPosition(
        p => fetchWeather(p.coords.latitude, p.coords.longitude),
        () => showError('Location access denied')
      );
    }
  </script>
</body>
</html>
